name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK уже предустановлен на раннерах GitHub (ANDROID_HOME)
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -vE "^> Task|^$" build.log | grep -E -A4 "^e: |error:|What went wrong" | grep -v "^--" | head -10 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleWord-apk
          path: app/build/outputs/apk/release/*.apk
